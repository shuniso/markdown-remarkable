[package]
name = "markdown-remarkable"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
notify = "8.2.0"
open = "5.4.1"
pulldown-cmark = "0.13.4"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"
