[package]
name = "markdown-remarkable"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A tiny native Markdown viewer with live reload and inline review comments"
repository = "https://github.com/shuniso/markdown-remarkable"
readme = "README.md"
keywords = ["markdown", "viewer", "gui"]
categories = ["gui", "command-line-utilities"]

[[bin]]
name = "markdown-remarkable"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
notify = "8.2.0"
open = "5.4.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tao = "0.37.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tiny_http = "0.12.0"
wry = { version = "0.56.1", features = ["linux-body"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }
