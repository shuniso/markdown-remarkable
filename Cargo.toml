[package]
name = "markdown-remarkable"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
notify = "8.2.0"
open = "5.4.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
tao = "0.37.0"
tiny_http = "0.12.0"
wry = "0.56.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
